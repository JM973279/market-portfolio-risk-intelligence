name: Portfolio forward recovery

on:
  push:
    branches: [main]
    paths: ['.github/workflows/portfolio-forward-recovery.yml']

# Temporary operational workflow, removed after the approved recovery.
permissions:
  actions: write

concurrency:
  group: portfolio-forward-recovery
  cancel-in-progress: false

jobs:
  enable-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Enable the approved collection workflow
        run: |
          gh api --method PUT "repos/$GH_REPO/actions/workflows/portfolio-forward-validation.yml/enable"
          gh api "repos/$GH_REPO/actions/workflows/portfolio-forward-validation.yml" --jq '{state, path}'
      - name: Run collection with existing sealed state
        run: gh api --method POST "repos/$GH_REPO/actions/workflows/portfolio-forward-validation.yml/dispatches" --raw-field ref=main
      - name: Run the independent watchdog
        run: gh api --method POST "repos/$GH_REPO/actions/workflows/portfolio-forward-watchdog.yml/dispatches" --raw-field ref=main
